name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q

  build:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  govet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd go && go vet ./... && go build ./...

  binary:
    needs: [pytest, govet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build static binaries (CGO-free)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd go
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os=${t%-*}; arch=${t#*-}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.Version=${TAG#v}" \
              -o ../cpa-stats-$t .
          done
          file ../cpa-stats-linux-amd64
          # smoke-check the native artifact
          ./cpa-stats-$(go env GOOS)-$(go env GOARCH) --version || \
            ./cpa-stats-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: cpa-stats-*

  release:
    needs: [pytest, build, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/**
          generate_release_notes: true
