name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gotest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd go && go vet ./... && go test ./...

  binary:
    needs: gotest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build static binaries (CGO-free)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd go
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os=${t%-*}; arch=${t#*-}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.Version=${TAG#v}" \
              -o ../cpa-stats-$t .
          done
          file ../cpa-stats-linux-amd64
          # smoke-check the native artifact
          cd .. && ./cpa-stats-$(go env GOOS)-$(go env GOARCH) --version
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: cpa-stats-*

  release:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/**
          generate_release_notes: true
