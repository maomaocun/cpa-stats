name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q

  build:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binary:
    needs: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux: build on the oldest runner with the SYSTEM python —
          # setup-python's libpython needs newer glibc than target boxes
          - { os: ubuntu-22.04, name: linux-amd64, sys: true }
          - { os: macos-latest, name: darwin-arm64, sys: false }
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !matrix.sys }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build onefile binary
        run: |
          if [ "${{ matrix.sys }}" = "true" ]; then PY=python3; else PY=python; fi
          $PY -m pip install -e . pyinstaller
          $PY -m PyInstaller --onefile --name cpa-stats \
            --collect-all textual --collect-all rich \
            --copy-metadata cpa-stats cpa_stats_entry.py
          ./dist/cpa-stats --version
          mv dist/cpa-stats cpa-stats-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: cpa-stats-${{ matrix.name }}

  release:
    needs: [pytest, build, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/**
          generate_release_notes: true
