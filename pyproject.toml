[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-stats"
version = "2.0.0"
description = "Per-request latency / TTFT / TPS / cost monitoring for CLIProxyAPI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rich>=13"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cpa-stats = "cpa_stats.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
